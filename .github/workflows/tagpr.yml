name: tagpr

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tagpr:
    runs-on: ubuntu-latest
    outputs:
      tagpr-tag: ${{ steps.run-tagpr.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        run: rustup update stable

      - name: Install cargo-about
        run: cargo install cargo-about --locked

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - id: run-tagpr
        name: Run tagpr
        uses: Songmu/tagpr@2afc990a4a5a9a340665cc1a484c2102f7de332f # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assets:
    name: Release Assets (${{ matrix.target }})
    needs: tagpr
    if: needs.tagpr.outputs.tagpr-tag != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
            os_name: linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
            os_name: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            os_name: darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: amd64
            os_name: darwin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        if: matrix.os == 'ubuntu-latest'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - name: Build binary
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo install cargo-zigbuild --locked
            cargo zigbuild --release --target ${{ matrix.target }}
          fi

      - name: Package release asset
        env:
          TAG: ${{ needs.tagpr.outputs.tagpr-tag }}
        run: |
          VERSION="${TAG#v}"
          cargo run -- --completions
          ASSET_DIR="glas-${VERSION}_${{ matrix.arch }}_${{ matrix.os_name }}"
          mkdir -p "dist/${ASSET_DIR}"
          cp "target/${{ matrix.target }}/release/glas" "dist/${ASSET_DIR}/"
          cp README.md LICENSE CREDITS.md "dist/${ASSET_DIR}/"
          cp -r completions "dist/${ASSET_DIR}/"
          tar cvfz "dist/${ASSET_DIR}.tar.gz" -C dist "${ASSET_DIR}"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tagpr.outputs.tagpr-tag }}
        run: |
          VERSION="${TAG#v}"
          ASSET_FILE="dist/glas-${VERSION}_${{ matrix.arch }}_${{ matrix.os_name }}.tar.gz"
          gh release upload "${TAG}" "${ASSET_FILE}"
